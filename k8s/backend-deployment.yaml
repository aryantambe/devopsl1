apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookhub-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bookhub-backend
  template:
    metadata:
      labels:
        app: bookhub-backend
    spec:
      containers:
        - name: bookhub-backend
          image: bookhub-backend:local
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: bookhub-config
                  key: DATABASE_HOST
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: bookhub-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bookhub-secret
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: bookhub-config
                  key: DATABASE_NAME
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: bookhub-backend
spec:
  selector:
    app: bookhub-backend
  ports:
    - port: 5000
      targetPort: 5000
